name: biohack-spatial
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy>=2.2
  - pandas>=2.3
  - matplotlib>=3.10
  - scipy>=1.15
  - scikit-learn>=1.7
  - anndata>=0.11
  - scanpy>=1.11
  - pyyaml>=6.0
  - leidenalg>=0.10
  - h5py>=3.10
  - pyarrow>=19.0
  - jupyter
  - ipykernel
  - nbconvert
  - pip
  - pip:
      - typing-extensions>=4.12
